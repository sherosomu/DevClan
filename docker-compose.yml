# Local Postgres + Redis for development and the integration tests.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devclan
    ports: ["5432:5432"]
    volumes:
      - ./server/init-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
